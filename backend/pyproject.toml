[project]
name = "ticketing-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "chromadb>=0.5",
    "mcp>=1.9",
    "anthropic>=1.0",
    "google-genai>=2.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp -m \"not live_api and not live_smtp and not live_gemini and not live_dossier\""
asyncio_mode = "auto"
markers = [
    "live_api: hits the real Anthropic API and costs real money -- excluded from the default run",
    "live_smtp: sends one real email through the configured SMTP server -- excluded from the default run",
    "live_gemini: hits the real Gemini API and costs real money -- excluded from the default run",
    "live_dossier: builds one real incident dossier through the Anthropic API and costs real money -- excluded from the default run",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
