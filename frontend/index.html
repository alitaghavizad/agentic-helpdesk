<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agentic IT helpdesk — chat, tickets, approvals, and agent traces." />
    <meta name="color-scheme" content="light dark" />
    <title>Agentic Helpdesk</title>
    <script>
      // Applied before first paint. Leaving this to React's own effect means
      // a dark-theme user gets one white frame on every load, which is the
      // flash the class-based strategy exists to avoid. Kept in sync with
      // src/lib/theme.ts (same key, same fallback order).
      (function () {
        try {
          var stored = localStorage.getItem("helpdesk.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage blocked -- light is the documented default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
