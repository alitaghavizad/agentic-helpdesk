server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router owns the URL space. Without this fallback, a hard refresh
  # or a pasted link on any route other than "/" -- /admin/traces, say --
  # asks nginx for a file that was never built and gets a 404, even though
  # the app itself handles that path perfectly well once it has loaded.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed filenames, so these can be cached indefinitely. index.html is
  # deliberately NOT in here: it is the file that names the current hashes,
  # and caching it is how a deploy goes out and nobody sees it.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
